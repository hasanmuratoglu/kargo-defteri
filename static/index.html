<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kargo Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F3EC; --paper-raised: #FFFFFF; --ink: #23262B; --ink-soft: #5B5F66;
    --line: #C9C2B2; --accent: #2B4A6F; --accent-soft: #E7EEF5;
    --stamp: #C8790A; --stamp-soft: #FBEBD4; --danger: #A23B32; --radius: 4px;
    --sans: 'IBM Plex Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); line-height: 1.5; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 64px; }
  header.top { display: flex; align-items: baseline; justify-content: space-between; padding: 6px 2px 18px; border-bottom: 2px solid var(--ink); margin-bottom: 22px; }
  header.top h1 { font-size: 1.35rem; font-weight: 700; margin: 0; }
  header.top .count { font-family: var(--mono); font-size: 0.8rem; color: var(--ink-soft); }
  .label-card { background: var(--paper-raised); border: 1.5px solid var(--ink); border-radius: var(--radius); padding: 18px; margin-bottom: 28px; }
  .photo-zone { border: 2px dashed var(--line); border-radius: var(--radius); padding: 16px; text-align: center; margin-bottom: 16px; cursor: pointer; }
  .photo-zone.has-photo { padding: 0; border-style: solid; overflow: hidden; }
  .photo-zone img { display: block; width: 100%; max-height: 240px; object-fit: cover; }
  .photo-zone .hint { color: var(--ink-soft); font-size: 0.88rem; }
  .photo-zone .hint strong { display: block; color: var(--ink); font-size: 0.98rem; margin-bottom: 3px; font-weight: 600; }
  .photo-actions { display: flex; gap: 8px; margin: -6px 0 16px; }
  .photo-actions button { flex: 1; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 5px; font-weight: 500; }
  .field input, .field select, .field textarea {
    width: 100%; border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--paper);
    color: var(--ink); font-family: var(--sans); font-size: 0.96rem; padding: 9px 10px;
  }
  .field textarea { resize: vertical; min-height: 56px; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ocr-status { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--accent); margin-bottom: 14px; font-family: var(--mono); }
  .ocr-status.err { color: var(--danger); }
  .spin { width: 13px; height: 13px; border: 2px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .raw-text-box { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; font-family: var(--mono); font-size: 0.8rem; white-space: pre-wrap; max-height: 140px; overflow-y: auto; margin-bottom: 14px; }
  .raw-text-box .lbl { font-family: var(--sans); font-size: 0.72rem; color: var(--ink-soft); margin-bottom: 6px; }
  button.primary { width: 100%; background: var(--ink); color: var(--paper-raised); border: none; border-radius: var(--radius); padding: 13px; font-family: var(--sans); font-weight: 600; font-size: 1rem; cursor: pointer; }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: var(--paper-raised); color: var(--ink); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 9px; font-family: var(--sans); font-weight: 500; font-size: 0.88rem; cursor: pointer; }
  .list h2 { font-size: 0.82rem; color: var(--ink-soft); font-weight: 600; margin: 0 0 12px; font-family: var(--mono); }
  .empty { color: var(--ink-soft); font-size: 0.9rem; padding: 24px 8px; text-align: center; border: 2px dashed var(--line); border-radius: var(--radius); }
  .item { display: flex; gap: 12px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; cursor: pointer; }
  .item .thumb { width: 56px; height: 56px; border-radius: var(--radius); object-fit: cover; flex: none; background: var(--paper); border: 1px solid var(--line); }
  .item .thumb.none { display: flex; align-items: center; justify-content: center; color: var(--ink-soft); font-size: 1.3rem; }
  .item .body { min-width: 0; flex: 1; }
  .item .name-row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .item .name { font-weight: 600; font-size: 0.96rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .date { font-family: var(--mono); font-size: 0.72rem; color: var(--ink-soft); flex: none; }
  .item .content { font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .tag { display: inline-block; font-size: 0.7rem; font-family: var(--mono); background: var(--stamp-soft); color: var(--stamp); padding: 2px 6px; border-radius: 3px; margin-top: 5px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal { background: var(--paper-raised); width: 100%; max-width: 640px; max-height: 88vh; overflow-y: auto; border-radius: 14px 14px 0 0; padding: 20px; }
  .modal img { width: 100%; border-radius: var(--radius); margin-bottom: 14px; border: 1px solid var(--line); }
  .modal dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 0.92rem; margin: 0 0 18px; }
  .modal dt { color: var(--ink-soft); } .modal dd { margin: 0; }
  .modal-close { display: block; text-align: center; color: var(--ink-soft); font-size: 0.85rem; margin-bottom: 14px; }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Kargo Defteri</h1>
    <span class="count" id="count">— kayıt</span>
  </header>

  <div class="label-card">
    <div class="photo-zone" id="photoZone" style="display:none;">
      <div class="hint" id="photoHint">
        <strong>Etiketin fotoğrafını çek</strong>
        Yazılar otomatik okunur, sen düzenlersin
      </div>
    </div>
    <div class="photo-actions" id="photoActions" style="display:none;">
      <button type="button" class="secondary" id="retakeBtn">Yeniden çek</button>
      <button type="button" class="secondary" id="rereadBtn">Tekrar oku</button>
    </div>
    <div class="photo-buttons" id="photoButtons" style="display:flex; gap:8px; margin-bottom:16px;">
      <button type="button" class="secondary" id="cameraBtn" style="flex:1;">📷 Fotoğraf çek</button>
      <button type="button" class="secondary" id="galleryBtn" style="flex:1;">🖼️ Galeriden seç</button>
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <input type="file" id="galleryInput" accept="image/*">

    <div class="ocr-status" id="ocrStatus" style="display:none;"></div>
    <div class="raw-text-box" id="rawTextBox" style="display:none;">
      <div class="lbl">Fotoğraftan okunan yazı (gerekeni aşağıya kopyala)</div>
      <div id="rawTextContent"></div>
    </div>

    <div class="field">
      <label for="fName">Alıcı adı soyadı</label>
      <input type="text" id="fName" placeholder="Elle yaz ya da okunan yazıdan kopyala">
    </div>
    <div class="field">
      <label for="fAddress">Adres</label>
      <textarea id="fAddress" placeholder="Elle yaz ya da okunan yazıdan kopyala"></textarea>
    </div>
    <div class="field">
      <label for="fPhone">Telefon (varsa)</label>
      <input type="tel" id="fPhone" placeholder="—">
    </div>
    <div class="field">
      <label for="fContent">Kargo içeriği</label>
      <textarea id="fContent" placeholder="Ne gönderildi?"></textarea>
    </div>
    <div class="row2">
      <div class="field">
        <label for="fCarrier">Kargo firması</label>
        <select id="fCarrier">
          <option value="">Seç</option>
          <option>Yurtiçi Kargo</option>
          <option>Aras Kargo</option>
          <option>MNG Kargo</option>
          <option>Sürat Kargo</option>
          <option>PTT Kargo</option>
          <option>HepsiJet</option>
          <option>Diğer</option>
        </select>
      </div>
      <div class="field">
        <label for="fDate">Tarih</label>
        <input type="date" id="fDate">
      </div>
    </div>
    <div class="field">
      <label for="fEnteredBy">Giren kişi</label>
      <input type="text" id="fEnteredBy" placeholder="Adın">
    </div>

    <button type="button" class="primary" id="saveBtn">Kaydı ekle</button>
  </div>

  <div class="list">
    <h2>KAYITLAR</h2>
    <div id="listEl"><div class="empty">Yükleniyor…</div></div>
  </div>
</div>

<div id="modalRoot"></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const photoZone = $('photoZone'), photoHint = $('photoHint'), photoActions = $('photoActions');
  const photoButtons = $('photoButtons');
  const ocrStatus = $('ocrStatus');
  const rawTextBox = $('rawTextBox'), rawTextContent = $('rawTextContent');
  const fName = $('fName'), fAddress = $('fAddress'), fPhone = $('fPhone'),
        fContent = $('fContent'), fCarrier = $('fCarrier'), fDate = $('fDate'), fEnteredBy = $('fEnteredBy');
  const saveBtn = $('saveBtn'), listEl = $('listEl'), countEl = $('count');

  fDate.value = new Date().toISOString().slice(0, 10);
  try {
    const savedName = localStorage.getItem('kargo_entered_by');
    if (savedName) fEnteredBy.value = savedName;
  } catch (e) {}

  let currentPhotoFile = null;

  function setOcr(msg, kind) {
    if (!msg) { ocrStatus.style.display = 'none'; return; }
    ocrStatus.style.display = 'flex';
    ocrStatus.className = 'ocr-status' + (kind === 'err' ? ' err' : '');
    ocrStatus.innerHTML = kind === 'loading'
      ? '<span class="spin"></span><span>' + msg + '</span>'
      : '<span>' + msg + '</span>';
  }

  function compressImage(file, maxW) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e) => { img.src = e.target.result; };
      reader.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.88);
      };
      img.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function runOcr(file) {
    setOcr('Yazılar okunuyor…', 'loading');
    rawTextBox.style.display = 'none';
    try {
      const fd = new FormData();
      fd.append('photo', file, 'label.jpg');
      const res = await fetch('/api/ocr', { method: 'POST', body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'OCR hatası');
      if (data.phone) fPhone.value = data.phone;
      if (data.raw_text) {
        rawTextBox.style.display = 'block';
        rawTextContent.textContent = data.raw_text;
        setOcr('Yazı okundu — aşağıdan isim/adresi kutulara kopyala.', 'ok');
      } else {
        setOcr('Yazı okunamadı — elle girebilirsin.', 'err');
      }
    } catch (e) {
      setOcr('Otomatik okuma başarısız — elle girebilirsin.', 'err');
    }
  }

  async function handleFile(file) {
    if (!file) return;
    const compressed = await compressImage(file, 1600);
    currentPhotoFile = compressed;
    const url = URL.createObjectURL(compressed);
    photoZone.style.display = 'block';
    photoZone.classList.add('has-photo');
    photoZone.innerHTML = '<img src="' + url + '" alt="Etiket fotoğrafı">';
    photoButtons.style.display = 'none';
    photoActions.style.display = 'flex';
    await runOcr(compressed);
  }

  photoZone.addEventListener('click', () => {}); // artık sadece önizleme alanı
  $('cameraBtn').addEventListener('click', () => $('cameraInput').click());
  $('galleryBtn').addEventListener('click', () => $('galleryInput').click());
  $('cameraInput').addEventListener('change', (e) => handleFile(e.target.files[0]));
  $('galleryInput').addEventListener('change', (e) => handleFile(e.target.files[0]));
  $('retakeBtn').addEventListener('click', () => { $('cameraInput').value = ''; $('galleryInput').value = ''; photoButtons.style.display = 'flex'; photoZone.style.display = 'none'; photoZone.classList.remove('has-photo'); photoActions.style.display = 'none'; rawTextBox.style.display = 'none'; setOcr('', null); });
  $('rereadBtn').addEventListener('click', () => { if (currentPhotoFile) runOcr(currentPhotoFile); });

  function resetForm() {
    fName.value = ''; fAddress.value = ''; fPhone.value = ''; fContent.value = ''; fCarrier.value = '';
    fDate.value = new Date().toISOString().slice(0, 10);
    currentPhotoFile = null;
    $('cameraInput').value = ''; $('galleryInput').value = '';
    photoZone.classList.remove('has-photo');
    photoZone.style.display = 'none';
    photoHint.innerHTML = '<strong>Etiketin fotoğrafını çek</strong>Yazılar otomatik okunur, sen düzenlersin';
    photoZone.innerHTML = ''; photoZone.appendChild(photoHint);
    photoButtons.style.display = 'flex';
    photoActions.style.display = 'none';
    rawTextBox.style.display = 'none';
    setOcr('', null);
  }

  saveBtn.addEventListener('click', async () => {
    if (!fContent.value.trim()) { fContent.focus(); return; }
    if (!fCarrier.value) { fCarrier.focus(); return; }
    saveBtn.disabled = true; saveBtn.textContent = 'Kaydediliyor…';
    try {
      if (fEnteredBy.value.trim()) {
        try { localStorage.setItem('kargo_entered_by', fEnteredBy.value.trim()); } catch (e) {}
      }
      const fd = new FormData();
      fd.append('name', fName.value.trim());
      fd.append('address', fAddress.value.trim());
      fd.append('phone', fPhone.value.trim());
      fd.append('content', fContent.value.trim());
      fd.append('carrier', fCarrier.value);
      fd.append('date', fDate.value);
      fd.append('entered_by', fEnteredBy.value.trim());
      if (currentPhotoFile) fd.append('photo', currentPhotoFile, 'label.jpg');

      const res = await fetch('/api/shipments', { method: 'POST', body: fd });
      if (!res.ok) throw new Error('save failed');
      resetForm();
      loadList();
    } catch (e) {
      alert('Kaydedilemedi, tekrar dener misin?');
    } finally {
      saveBtn.disabled = false; saveBtn.textContent = 'Kaydı ekle';
    }
  });

  function esc(s) {
    return (s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtDate(d) {
    if (!d) return '';
    const p = d.split('-');
    return p.length === 3 ? p[2] + '.' + p[1] + '.' + p[0] : d;
  }

  function openModal(item) {
    const root = $('modalRoot');
    const photoHtml = item.photo ? '<img src="' + item.photo + '" alt="Etiket">' : '';
    root.innerHTML =
      '<div class="modal-bg" id="modalBg"><div class="modal">' +
        '<div class="modal-close" id="modalClose">Kapat ✕</div>' + photoHtml +
        '<dl>' +
          '<dt>Alıcı</dt><dd>' + esc(item.name || '—') + '</dd>' +
          '<dt>Adres</dt><dd>' + esc(item.address || '—') + '</dd>' +
          '<dt>Telefon</dt><dd>' + esc(item.phone || '—') + '</dd>' +
          '<dt>İçerik</dt><dd>' + esc(item.content || '—') + '</dd>' +
          '<dt>Kargo</dt><dd>' + esc(item.carrier || '—') + '</dd>' +
          '<dt>Tarih</dt><dd>' + fmtDate(item.date) + '</dd>' +
          '<dt>Giren</dt><dd>' + esc(item.entered_by || '—') + '</dd>' +
        '</dl>' +
        '<button type="button" class="secondary" id="deleteBtn" style="width:100%;color:var(--danger);border-color:var(--danger);">Kaydı sil</button>' +
      '</div></div>';
    $('modalBg').addEventListener('click', (e) => { if (e.target.id === 'modalBg') root.innerHTML = ''; });
    $('modalClose').addEventListener('click', () => { root.innerHTML = ''; });
    $('deleteBtn').addEventListener('click', async () => {
      if (!confirm('Bu kaydı silmek istediğine emin misin?')) return;
      try {
        await fetch('/api/shipments/' + item.id, { method: 'DELETE' });
        root.innerHTML = '';
        loadList();
      } catch (e) { alert('Silinemedi.'); }
    });
  }

  function render(items) {
    countEl.textContent = items.length + ' kayıt';
    if (!items.length) { listEl.innerHTML = '<div class="empty">Henüz kayıt yok.</div>'; return; }
    listEl.innerHTML = '';
    items.forEach((item) => {
      const row = document.createElement('div');
      row.className = 'item';
      const thumb = item.photo ? '<img class="thumb" src="' + item.photo + '" alt="">' : '<div class="thumb none">📦</div>';
      row.innerHTML =
        thumb +
        '<div class="body"><div class="name-row"><span class="name">' + esc(item.name || 'İsimsiz') +
        '</span><span class="date">' + fmtDate(item.date) + '</span></div>' +
        '<div class="content">' + esc(item.content || '') + '</div>' +
        '<span class="tag">' + esc(item.carrier || '—') + (item.entered_by ? ' · ' + esc(item.entered_by) : '') + '</span></div>';
      row.addEventListener('click', () => openModal(item));
      listEl.appendChild(row);
    });
  }

  let lastSignature = '';
  async function loadList() {
    try {
      const res = await fetch('/api/shipments');
      const items = await res.json();
      const sig = JSON.stringify(items.map((i) => i.id));
      if (sig !== lastSignature) { lastSignature = sig; render(items); }
      else if (listEl.querySelector('.empty') && items.length === 0) { /* no-op */ }
    } catch (e) {
      if (!listEl.children.length) listEl.innerHTML = '<div class="empty">Bağlantı kurulamadı.</div>';
    }
  }

  loadList();
  setInterval(loadList, 4000); // basit "anlık" güncelleme: 4 saniyede bir yeniler
})();
</script>
</body>
</html>
